[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parlliament"
version = "0.1.0"
description = "Sequential, hypothesis-driven autonomous recommender-system experimentation"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "pandas>=2.0,<3.0",
    "scikit-learn>=1.3,<2.0",
]

[project.scripts]
parlliament = "parlliament.cli:main"
parlliament-populate-knowledge = "parlliament.knowledge_builder:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["parlliament*"]

[tool.setuptools.package-data]
parlliament = [
    "seed/*.py",
    "seed/*.json",
    "seed_kuairand_baseline/*.py",
    "seed_kuairand_baseline/*.json",
    "knowledge/*.md",
    "knowledge/*.json",
    "knowledge/*.jsonl",
    "knowledge/*/*.md",
]
